title: Обнаружение дампа памяти LSASS через ProcDump
id: a7d36a3e-63f2-4a0b-99d9-bbdf139268f7
status: experimental
description: Обнаруживает запуск утилиты ProcDump для создания дампа памяти процесса lsass.exe с целью извлечения учетных данных.
references:
    - https://mitre.org
author: AI Collaborator
date: 2026/10/31
tags:
    - attack.credential_access
    - attack.t1003.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\procdump.exe'
        - Image|endswith: '\procdump64.exe'
        - OriginalFileName: 'procdump'
    selection_cli:
        CommandLine|contains: 'lsass'
    condition: selection_img and selection_cli
falsepositives:
    - Легитимная работа администраторов или разработчиков по отладке упавших процессов (крайне редко для lsass).
level: critical
